<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pano</title>
    <script>
      // Kayıtlı temayı ilk boyamadan önce uygula; yoksa sayfa bir an yanlış renkte açılır.
      try {
        var t = localStorage.getItem('pano-theme'), a = localStorage.getItem('pano-accent')
        if (t && t !== 'system') document.documentElement.dataset.theme = t
        document.documentElement.dataset.accent = a || 'blue'
      } catch (e) { document.documentElement.dataset.accent = 'blue' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
